# ---------------------------------------------------------------------------
# CI — Integracion continua (CI_CD.md seccion 4.1)
#
# Valida cada push y cada pull request. No despliega nada.
#
# SECRETOS QUE NECESITA: ninguno obligatorio.
#   - GITHUB_TOKEN ......... lo inyecta GitHub automaticamente; no hay que crearlo.
#   - GITLEAKS_LICENSE ..... SOLO si el repositorio pertenece a una ORGANIZACION de
#                            GitHub. Este repositorio es personal y publico
#                            (joansel25/FlexGrade), asi que gitleaks-action funciona
#                            gratis y sin licencia. Si algun dia el repo se mueve a
#                            una organizacion, hay que darla de alta en
#                            Settings -> Secrets and variables -> Actions.
#   - DOCKERHUB_USER / DOCKERHUB_TOKEN ... solo para el paso de `docker scout`, que
#                            hoy esta comentado (ver job docker-build).
#
# Este workflow tambien es invocable como workflow reutilizable (`workflow_call`):
# los workflows de despliegue lo llaman con `uses:` para cumplir el requisito
# "correr todo el ci.yml primero" (CI_CD.md secciones 4.2 y 4.3).
# ---------------------------------------------------------------------------

name: CI

on:
  push:
  pull_request:
  workflow_call:

# Un push nuevo sobre la misma rama cancela la corrida anterior: ahorra minutos y
# la señal util es siempre la del ultimo commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Deteccion de partes del repositorio que todavia no existen.
  #
  # El frontend llega en la Fase 5 (DEVELOPMENT_WORKFLOW.md). En lugar de dejar
  # el job `frontend-ci` comentado —que habria que descomentar a mano y se
  # olvidaria— se detecta si `frontend/package.json` existe y el job se condiciona
  # a esa salida. Hoy se salta limpiamente; el dia que se cree el frontend se
  # activa solo, sin tocar este archivo.
  # -------------------------------------------------------------------------
  detect:
    name: Detectar componentes del repositorio
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar si existe el frontend
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Frontend detectado: se ejecutara frontend-ci."
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend ausente::No existe frontend/package.json; el job frontend-ci se omite. Se activara solo cuando la Fase 5 cree el frontend."
          fi

  # -------------------------------------------------------------------------
  # Backend: lint -> tests -> auditoria de dependencias -> escaneo de secretos.
  # El codigo Python vive en `backend/`, por eso todos los pasos usan
  # `working-directory: backend`.
  # -------------------------------------------------------------------------
  backend-ci:
    name: Backend (lint, tests, seguridad)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action comenta el hallazgo en el PR cuando encuentra un secreto.
      pull-requests: write

    # Postgres y Redis quedan disponibles para los tests de integracion. Se usan
    # las mismas versiones mayores que en produccion (CI_CD.md / docker-compose).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matricula
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: matricula_test
        ports:
          - 5432:5432
        # El job espera a que la base acepte conexiones de verdad, no a que el
        # contenedor exista.
        options: >-
          --health-cmd "pg_isready -U matricula -d matricula_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      # fetch-depth: 0 -> gitleaks necesita el historial completo para escanear
      # los commits del push o del PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # pyproject.toml declara requires-python = ">=3.12,<3.13".
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (black, isort, mypy)
        working-directory: backend
        run: |
          black --check app tests
          isort --check-only app tests
          mypy app

      # -----------------------------------------------------------------------
      # Tests unitarios, con el umbral de cobertura sobre el NUCLEO.
      #
      # CI_CD.md seccion 4.1 paso 5 decia `--cov=app --cov-fail-under=80`: medir
      # TODA la aplicacion usando SOLO los tests unitarios. Ese gate estaba mal
      # planteado y se rompia solo al crecer el proyecto.
      #
      # Los adaptadores de `infrastructure/` (SQLAlchemy, Redis) no se prueban
      # con tests unitarios sino de integracion, contra Postgres y Redis reales:
      # es la unica forma de probarlos que da una senal veraz. Medirlos con
      # `-m unit` los cuenta siempre como no cubiertos, asi que cada adaptador
      # nuevo empujaba la cifra global hacia abajo. Los dos de la Fase 1 ya
      # estaban al 45% y 50%, y la cifra habia caido de 86% a 80.6% rozando el
      # umbral. La Fase 2, que trae cuatro adaptadores mas, lo habria puesto en
      # rojo sin que hubiera ni un solo test de menos: el CI habria estado
      # midiendo la capa equivocada. Un gate que falla por su propio diseno
      # termina desactivado, y entonces ya no protege nada.
      #
      # El umbral se aplica ahora sobre `domain` y `application`, que son las
      # capas que los tests unitarios SI deben cubrir por completo: ahi viven las
      # reglas de negocio (cupos, prerrequisitos, horarios, vigencia del periodo)
      # y no dependen de nada externo, luego no hay excusa para no probarlas.
      # El umbral sube de 80% a 90%, y hoy la cifra real es del 94%.
      #
      # `infrastructure/` e `interfaces/` los garantizan los tests de integracion
      # y e2e de los pasos siguientes, que son funcionales: comprueban que el
      # adaptador hace lo que promete, no cuantas de sus lineas se ejecutaron.
      # -----------------------------------------------------------------------
      - name: Tests unitarios (cobertura del nucleo, umbral del 90%)
        working-directory: backend
        run: pytest -m unit --cov=app/domain --cov=app/application --cov-fail-under=90

      # -----------------------------------------------------------------------
      # Tests e2e en proceso.
      #
      # Al pasar el paso anterior de `-m "not integration"` a `-m unit`, los tests
      # marcados `e2e` dejaron de ejecutarse en ningun sitio: el job `e2e` de
      # deploy-staging.yml, que es su destino final, sigue comentado hasta que
      # exista el ambiente desplegado. Un test que no corre no protege nada, asi
      # que se ejecutan aqui mientras tanto.
      #
      # Hoy no necesitan servicios: usan TestClient contra la app en proceso.
      # Cuando deploy-staging.yml los apunte a la URL real de STAGING, este paso
      # se elimina y su cobertura pasa alli.
      # -----------------------------------------------------------------------
      - name: Tests e2e (en proceso, contra la app con TestClient)
        working-directory: backend
        run: pytest -m e2e

      # -----------------------------------------------------------------------
      # Tests de integracion.
      #
      # Las migraciones se aplican ANTES de los tests: sin ellas la base de datos
      # del runner esta vacia y cada test fallaria con "relation does not exist".
      # Se usa alembic (y no un create_all) para ejercitar en CI exactamente el
      # mismo camino que corre en DEV, STAGING y PROD.
      # -----------------------------------------------------------------------
      - name: Migraciones sobre la base de datos de pruebas
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://matricula:testpassword@localhost:5432/matricula_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: solo-para-ci-no-es-un-secreto-real
        run: alembic upgrade head

      - name: Tests de integracion (Postgres 16 + Redis 7)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://matricula:testpassword@localhost:5432/matricula_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: solo-para-ci-no-es-un-secreto-real
        run: pytest -m integration

      # -----------------------------------------------------------------------
      # Auditoria de dependencias (CI_CD.md seccion 8).
      #
      # Se audita EXACTAMENTE lo que se despliega: las dependencias de runtime
      # declaradas en `[project].dependencies` de pyproject.toml y su cierre
      # transitivo. Se leen del propio pyproject (una sola fuente de verdad, igual
      # que hace el Dockerfile) en vez de auditar todo el entorno del runner, que
      # incluiria `pip`, `setuptools` y las herramientas de desarrollo, que nunca
      # llegan a la imagen de produccion.
      #
      # Los avisos ignorados abajo son deuda tecnica CONOCIDA y ACEPTADA, no un
      # apagado del gate: cualquier vulnerabilidad nueva pone el job en rojo.
      # Todos corresponden a `starlette 0.41.3`, que entra como dependencia
      # transitiva de `fastapi==0.115.6` (que exige starlette <0.42, por lo que no
      # se puede subir starlette sin subir antes fastapi).
      #
      # TODO(devops, 2026-08-22): subir fastapi para poder subir starlette y
      # eliminar estos --ignore-vuln. Es un cambio de dependencias, va en su
      # propio commit (BEST_PRACTICES.md seccion 11).
      # -----------------------------------------------------------------------
      - name: Auditoria de dependencias (pip-audit)
        working-directory: backend
        run: |
          python -m pip install --quiet pip-audit==2.7.3
          python - <<'PY' > "$RUNNER_TEMP/requirements-runtime.txt"
          import tomllib

          with open("pyproject.toml", "rb") as manifiesto:
              print("\n".join(tomllib.load(manifiesto)["project"]["dependencies"]))
          PY
          cat "$RUNNER_TEMP/requirements-runtime.txt"
          pip-audit \
            --strict \
            --progress-spinner off \
            --requirement "$RUNNER_TEMP/requirements-runtime.txt" \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281

      # -----------------------------------------------------------------------
      # Escaneo de secretos (CI_CD.md seccion 8).
      #
      # `gitleaks-action@v2` es gratuito en repositorios personales y publicos;
      # GITLEAKS_LICENSE solo hace falta si el repositorio pertenece a una
      # organizacion de GitHub.
      #
      # La configuracion se genera aqui (no se comitea) para permitir un unico
      # caso concreto: los tokens JWT de EJEMPLO de la documentacion, que estan
      # truncados con puntos suspensivos y por tanto no pueden ser credenciales
      # reales (matricula_docs/docs/API.md). El allowlist se ancla a esa cadena
      # literal, no a la ruta del archivo: si alguien filtra un secreto de verdad
      # en la documentacion, gitleaks lo sigue detectando.
      # -----------------------------------------------------------------------
      - name: Preparar configuracion de gitleaks
        run: |
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'TOML'
          title = "Matricula - configuracion de gitleaks para CI"

          [extend]
          useDefault = true

          [allowlist]
          description = "Tokens JWT de ejemplo truncados en la documentacion (no son credenciales)."
          regexTarget = "line"
          regexes = ['''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.''']
          TOML

      - name: Escaneo de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ runner.temp }}/gitleaks.toml
          # TODO(devops): descomentar SOLO si el repositorio pasa a una organizacion.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # -------------------------------------------------------------------------
  # Frontend (CI_CD.md seccion 4.1, trabajo `frontend-ci`).
  # Se ejecuta unicamente cuando el frontend existe. Fase 5.
  # -------------------------------------------------------------------------
  frontend-ci:
    name: Frontend (lint, tipos, tests, build)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificacion de tipos
        run: npm run type-check

      - name: Tests
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  # -------------------------------------------------------------------------
  # Construccion de la imagen Docker. Solo en pull requests hacia develop o main
  # (CI_CD.md seccion 4.1, trabajo `docker-build`).
  # -------------------------------------------------------------------------
  docker-build:
    name: Build de la imagen del backend
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      (github.base_ref == 'develop' || github.base_ref == 'main')
    steps:
      - uses: actions/checkout@v4

      # Construye la etapa final `runtime` del multi-stage. Sin push: aqui solo se
      # valida que la imagen compile.
      - name: Construir la imagen del backend
        run: docker build --tag matricula-backend:pr-${{ github.event.number }} ./backend

      # -----------------------------------------------------------------------
      # TODO(devops): escaneo de vulnerabilidades de la imagen con `docker scout`.
      #
      # Queda comentado porque `docker scout` exige autenticarse contra Docker Hub
      # y todavia no existen esos secretos. Para activarlo hay que crear en
      # Settings -> Secrets and variables -> Actions:
      #   - DOCKERHUB_USER   (usuario de Docker Hub)
      #   - DOCKERHUB_TOKEN  (Personal Access Token de Docker Hub, permiso de lectura)
      #
      # Politica al activarlo (CI_CD.md seccion 8): las vulnerabilidades criticas
      # bloquean el merge; medias y bajas solo advierten.
      #
      # - name: Autenticarse en Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USER }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: Escanear la imagen (docker scout)
      #   uses: docker/scout-action@v1
      #   with:
      #     command: cves
      #     image: matricula-backend:pr-${{ github.event.number }}
      #     only-severities: critical,high
      #     exit-code: true
      # -----------------------------------------------------------------------
