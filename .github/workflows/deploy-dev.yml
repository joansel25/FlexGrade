        run: |
          echo "::warning title=Despliegue no ejecutado::Los ambientes de AWS aun no estan aprovisionados (Fase 0). Los pasos de ECR, Alembic y Elastic Beanstalk estan comentados en .github/workflows/deploy-dev.yml. El CI si se ejecuto y esta verde."
          echo "Imagen que se construiria: ${IMAGE_TAG}"
          echo "Ambiente destino: ${EB_ENVIRONMENT} (${AWS_REGION})"

