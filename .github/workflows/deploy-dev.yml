# ---------------------------------------------------------------------------
# Despliegue a DESARROLLO (CI_CD.md seccion 4.2)
#
# Automatico en cada push a `develop`. Secuencia: CI completo -> imagen
# `dev-<sha>` -> ECR -> migraciones Alembic -> Elastic Beanstalk `matricula-dev`
# -> smoke tests -> notificacion.
#
# ESTADO ACTUAL (Fase 0): los ambientes de AWS todavia NO estan aprovisionados.
# Todos los pasos que tocan AWS estan comentados con un TODO. La estructura del
# workflow (triggers, jobs, orden de pasos, dependencias) si esta escrita y es
# YAML valido, para que activarla sea descomentar y no reescribir.
#
# SECRETOS QUE NECESITA (Settings -> Secrets and variables -> Actions):
#   - AWS_ACCESS_KEY_ID ....... credencial del usuario IAM del pipeline
#   - AWS_SECRET_ACCESS_KEY ... contraparte de la anterior
#   - ECR_REPOSITORY .......... URL del repositorio privado de imagenes
#   - SLACK_WEBHOOK_URL ....... opcional, solo para el paso de notificacion
#
# SECRETOS QUE **NO** VAN AQUI (viven en AWS Secrets Manager y los inyecta
# Elastic Beanstalk como variables de entorno, CI_CD.md seccion 7):
#   - DATABASE_URL_DEV, JWT_SECRET_KEY, REDIS_URL
# ---------------------------------------------------------------------------

name: Deploy DEV

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EB_APPLICATION: matricula
  EB_ENVIRONMENT: matricula-dev
  IMAGE_TAG: dev-${{ github.sha }}

jobs:
  # 1. "Correr todo el ci.yml primero": se reutiliza el propio workflow de CI en
  #    lugar de duplicar sus pasos. Si el CI falla, el despliegue no ocurre.
  ci:
    name: CI previo
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Desplegar en DEV
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

