# ---------------------------------------------------------------------------
# Despliegue a DESARROLLO (CI_CD.md seccion 4.2)
#
# Automatico en cada push a `develop`. Secuencia: CI completo -> imagen
# `dev-<sha>` -> ACR -> migraciones Alembic -> Azure App Service `matricula-dev`
# -> smoke tests -> notificacion.
#
# ESTADO ACTUAL (Fase 0): los ambientes de Azure todavia NO estan aprovisionados.
# Todos los pasos que tocan Azure estan comentados con un TODO. La estructura del
# workflow (triggers, jobs, orden de pasos, dependencias) si esta escrita y es
# YAML valido, para que activarla sea descomentar y no reescribir.
#
# SECRETOS QUE NECESITA (Settings -> Secrets and variables -> Actions):
#   - AZURE_CREDENTIALS ....... JSON de la entidad de servicio de Entra ID con
#                               rol Contributor sobre el grupo de recursos
#   - ACR_LOGIN_SERVER ........ p. ej. `matricula.azurecr.io`
#   - SLACK_WEBHOOK_URL ....... opcional, solo para el paso de notificacion
#
# SECRETOS QUE **NO** VAN AQUI (viven en Azure Key Vault y los resuelve el App
# Service con su identidad administrada, CI_CD.md seccion 7):
#   - DATABASE_URL_DEV, JWT_SECRET_KEY, REDIS_URL
# ---------------------------------------------------------------------------

name: Deploy DEV

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AZURE_LOCATION: eastus
  AZURE_RESOURCE_GROUP: matricula
  AZURE_WEBAPP_NAME: matricula-dev
  IMAGE_TAG: dev-${{ github.sha }}

jobs:
  # 1. "Correr todo el ci.yml primero": se reutiliza el propio workflow de CI en
  #    lugar de duplicar sus pasos. Si el CI falla, el despliegue no ocurre.
  ci:
    name: CI previo
    uses: ./.github/workflows/ci.yml
    # `backend-ci` pide `pull-requests: write` para que gitleaks pueda comentar el hallazgo
    # en el PR cuando encuentra un secreto. Un workflow LLAMADO no puede pedir mas permisos de
    # los que le concede quien lo llama, y el `permissions: contents: read` de arriba lo dejaba
    # en `pull-requests: none`: la corrida fallaba al arrancar, sin llegar a crear ningun job.
    #
    # Se concede aqui, en el job que hace la llamada, y NO a nivel de workflow: asi los pasos
    # de despliegue —que son los que tocan Azure— siguen sin poder escribir en pull requests.
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Desplegar en DEV
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v5

      - name: Estado del ambiente
        run: |
          echo "::warning title=Despliegue no ejecutado::Los ambientes de Azure aun no estan aprovisionados (Fase 0). Los pasos de ACR, Alembic y App Service estan comentados en .github/workflows/deploy-dev.yml. El CI si se ejecuto y esta verde."
          echo "Imagen que se construiria: ${IMAGE_TAG}"
          echo "Ambiente destino: ${AZURE_WEBAPP_NAME} (${AZURE_LOCATION})"

      # ---------------------------------------------------------------------
      # TODO(devops): descomentar cuando existan la suscripcion de Azure con ACR,
      # PostgreSQL Flexible Server y el App Service `matricula-dev`, y esten
      # cargados los secretos AZURE_CREDENTIALS / ACR_LOGIN_SERVER.
      # ---------------------------------------------------------------------
      #
      # - name: Autenticarse en Azure
      #   uses: azure/login@v2
