# ---------------------------------------------------------------------------
# Despliegue a DESARROLLO (CI_CD.md seccion 4.2)
#
# Automatico en cada push a `develop`. Secuencia: CI completo -> imagen
# `dev-<sha>` -> ACR -> migraciones Alembic -> Azure App Service `matricula-dev`
# -> smoke tests -> notificacion.
#
# ESTADO ACTUAL (Fase 0): los ambientes de Azure todavia NO estan aprovisionados.
# Todos los pasos que tocan Azure estan comentados con un TODO. La estructura del
# workflow (triggers, jobs, orden de pasos, dependencias) si esta escrita y es
# YAML valido, para que activarla sea descomentar y no reescribir.
#
# SECRETOS QUE NECESITA (Settings -> Secrets and variables -> Actions):
#   - AZURE_CREDENTIALS ....... JSON de la entidad de servicio de Entra ID con
#                               rol Contributor sobre el grupo de recursos
#   - ACR_LOGIN_SERVER ........ p. ej. `matricula.azurecr.io`
#   - AZURE_STORAGE_ACCOUNT ... cuenta con Static website activado (frontend)
#   - FRONTDOOR_PROFILE ....... perfil de Front Door
#   - FRONTDOOR_ENDPOINT ...... endpoint de Front Door, para purgar su cache
#   - SLACK_WEBHOOK_URL ....... opcional, solo para el paso de notificacion
#
# VARIABLES (no son secretos: viajan DENTRO del JavaScript compilado, asi que
# esconderlas no protegeria nada):
#   - VITE_API_BASE_URL_DEV / _STAGING / _PROD ... URL publica de la API
#
# SECRETOS QUE **NO** VAN AQUI (viven en Azure Key Vault y los resuelve el App
# Service con su identidad administrada, CI_CD.md seccion 7):
#   - DATABASE_URL_DEV, JWT_SECRET_KEY, REDIS_URL
# ---------------------------------------------------------------------------

name: Deploy DEV

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AZURE_LOCATION: eastus
  AZURE_RESOURCE_GROUP: matricula
  AZURE_WEBAPP_NAME: matricula-dev
  IMAGE_TAG: dev-${{ github.sha }}

jobs:
  # 1. "Correr todo el ci.yml primero": se reutiliza el propio workflow de CI en
  #    lugar de duplicar sus pasos. Si el CI falla, el despliegue no ocurre.
  ci:
    name: CI previo
    uses: ./.github/workflows/ci.yml
    # `backend-ci` pide `pull-requests: write` para que gitleaks pueda comentar el hallazgo
    # en el PR cuando encuentra un secreto. Un workflow LLAMADO no puede pedir mas permisos de
    # los que le concede quien lo llama, y el `permissions: contents: read` de arriba lo dejaba
    # en `pull-requests: none`: la corrida fallaba al arrancar, sin llegar a crear ningun job.
    #
    # Se concede aqui, en el job que hace la llamada, y NO a nivel de workflow: asi los pasos
    # de despliegue —que son los que tocan Azure— siguen sin poder escribir en pull requests.
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Desplegar en DEV
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v5

      - name: Estado del ambiente
        run: |
          echo "::warning title=Despliegue no ejecutado::Los ambientes de Azure aun no estan aprovisionados (Fase 0). Los pasos de ACR, Alembic y App Service estan comentados en .github/workflows/deploy-dev.yml. El CI si se ejecuto y esta verde."
          echo "Imagen que se construiria: ${IMAGE_TAG}"
          echo "Ambiente destino: ${AZURE_WEBAPP_NAME} (${AZURE_LOCATION})"

      # ---------------------------------------------------------------------
      # TODO(devops): descomentar cuando existan la suscripcion de Azure con ACR,
      # PostgreSQL Flexible Server y el App Service `matricula-dev`, y esten
      # cargados los secretos AZURE_CREDENTIALS / ACR_LOGIN_SERVER.
      # ---------------------------------------------------------------------
      #
      # - name: Autenticarse en Azure
      #   uses: azure/login@v2
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}
      #
      # - name: Autenticarse en Azure Container Registry
      #   run: az acr login --name "${{ secrets.ACR_LOGIN_SERVER }}"
      #
      # # 2. Construir la imagen con tag dev-<commit_sha>.
      # - name: Construir la imagen
      #   run: docker build --tag "${{ secrets.ACR_LOGIN_SERVER }}/matricula-backend:${IMAGE_TAG}" ./backend
      #
      # # 3. Subirla al registro privado.
      # - name: Publicar la imagen en ACR
      #   run: docker push "${{ secrets.ACR_LOGIN_SERVER }}/matricula-backend:${IMAGE_TAG}"
      #
      # # 4. Migraciones ANTES de que las instancias nuevas reciban trafico
      # #    (CI_CD.md seccion 6). Alembic solo avanza: ningun deploy revierte.
      # #    Con el servidor en VNet privada, el runner necesita alcanzarlo: o es
      # #    autoalojado dentro de la red, o se abre su IP en el firewall y se
      # #    cierra al terminar.
      # - name: Ejecutar migraciones de Alembic contra DEV
      #   working-directory: backend
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
      #   run: |
      #     pip install -e "."
      #     alembic upgrade head
      #
      # # 5. Desplegar en App Service.
      # #
      # # App Service no construye la imagen: se le dice CUAL descargar de ACR, asi que no
      # # hay ningun artefacto de despliegue que empaquetar aqui. Las opciones de aplicacion
      # # —incluida WEBSITES_PORT=8000, sin la cual App Service busca a uvicorn en el 80 y
      # # marca el sitio como caido— se cargan una sola vez desde deploy/azure/.
      # #
      # # `APP_VERSION` es la EXCEPCION: cambia en cada despliegue, asi que se escribe aqui y
      # # no en la plantilla. Sin esto `/health` responde siempre el valor por defecto del
      # # codigo, y ante un fallo no habria forma de saber que version esta arriba.
      # - name: Registrar la version desplegada
      #   run: |
      #     az webapp config appsettings set \
      #       --name "${AZURE_WEBAPP_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" \
      #       --settings "APP_VERSION=${IMAGE_TAG}"
      #
      # - name: Desplegar en Azure App Service
      #   uses: azure/webapps-deploy@v3
      #   with:
      #     app-name: ${{ env.AZURE_WEBAPP_NAME }}
      #     images: "${{ secrets.ACR_LOGIN_SERVER }}/matricula-backend:${{ env.IMAGE_TAG }}"
      #
      # # 6. Smoke tests. `/health` dice que el proceso responde; `/health/ready` dice que
      # #    ademas alcanza a PostgreSQL y a Azure Cache for Redis, que es el fallo tipico de
      # #    un ambiente recien configurado (endpoint equivocado, NSG cerrado, la referencia
      # #    al Key Vault sin resolver porque falta la identidad administrada).
      # #    OJO: `/health` vive en la raiz, NO bajo API_V1_PREFIX. No existe
      # #    `/api/v1/health`: el Application Gateway necesita una ruta fija e independiente
      # #    de la version de la API.
      # - name: Smoke tests contra DEV
      #   run: |
      #     url="https://dev.matricula.example.com"
      #     curl --fail --silent --show-error --max-time 10 "${url}/health"
      #     curl --fail --silent --show-error --max-time 10 "${url}/health/ready"
      #
      # # 7. Datos de ejemplo. SOLO EN DEV, y por eso este paso no existe en los
      # #    workflows de staging ni de produccion: alli sembraria datos falsos sobre
      # #    matriculas reales.
      # #
      # #    El seed es IDEMPOTENTE por contrato —comprueba antes de crear—, asi que
      # #    correrlo en cada despliegue no duplica nada y garantiza que el ambiente de
      # #    pruebas nunca este vacio. Va DESPUES de las migraciones: escribe sobre el
      # #    esquema que ellas dejan.
