      #   working-directory: backend
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
      #     REDIS_URL: ${{ secrets.REDIS_URL_DEV }}
      #     JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}
      #   run: python -m app.infrastructure.seed
      #
      # # 8. Notificacion del resultado (requiere SLACK_WEBHOOK_URL).
      # - name: Notificar resultado
      #   if: always()
      #   run: |
      #     curl --fail --silent --show-error \
      #       --header "Content-Type: application/json" \
      #       --data "{\"text\":\"Deploy DEV ${IMAGE_TAG}: ${{ job.status }}\"}" \
      #       "${{ secrets.SLACK_WEBHOOK_URL }}"
      # ---------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # 2. Frontend: archivos estaticos en Azure Storage, distribuidos por Front Door.
  #
  # Va en un job APARTE y DESPUES del backend, y las dos cosas importan:
  #
  # - Aparte, porque son dos artefactos distintos con dos destinos distintos. Una imagen
  #   Docker en ACR y un `dist/` de archivos estaticos no comparten ni construccion ni
  #   despliegue.
  # - Despues, porque `VITE_API_BASE_URL` se fija en tiempo de BUILD. El frontend compilado
  #   son archivos estaticos: no hay proceso donde leer una variable de entorno al arrancar,
  #   asi que la URL de la API queda incrustada en el JavaScript. Compilarlo antes de que la
  #   API responda produciria un paquete que apunta a un sitio que todavia no existe.
  # -------------------------------------------------------------------------
  desplegar-frontend:
    name: Desplegar el frontend en DEV
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v5

      - name: Estado del frontend
        run: |
          echo "::warning title=Frontend no publicado::El Storage Account y Front Door aun no estan aprovisionados (Fase 0). Los pasos estan comentados en .github/workflows/deploy-dev.yml."

