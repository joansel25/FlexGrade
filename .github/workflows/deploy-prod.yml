# ---------------------------------------------------------------------------
# Despliegue a PRODUCCION (CI_CD.md seccion 4.4)
#
# Manual (`workflow_dispatch`). Requiere que el commit ya este desplegado en
# staging y haya pasado los E2E, y APROBACION MANUAL de un revisor autorizado.
#
# La aprobacion la impone el GitHub Environment `production`. Para que exista de
# verdad hay que configurarlo una sola vez en:
#   Settings -> Environments -> New environment -> "production"
#     -> Required reviewers: el usuario o equipo autorizado
#     -> Deployment branches: solo `main`
# Sin esos revisores configurados, el environment existe pero NO detiene nada.
#
# ESTADO ACTUAL (Fase 0): los ambientes de Azure todavia NO estan aprovisionados.
# Los pasos que tocan Azure estan comentados con un TODO; la estructura del
# workflow (aprobacion, dry-run de migraciones, rolling deploy, health checks,
# tag) si esta escrita y es YAML valido.
#
# SECRETOS QUE NECESITA (Settings -> Secrets and variables -> Actions):
#   - AZURE_CREDENTIALS ....... JSON de la entidad de servicio de Entra ID con
#                               rol Contributor sobre el grupo de recursos
#   - ACR_LOGIN_SERVER ........ p. ej. `matricula.azurecr.io`
#   - AZURE_STORAGE_ACCOUNT ... cuenta con Static website activado (frontend)
#   - FRONTDOOR_PROFILE ....... perfil de Front Door
#   - FRONTDOOR_ENDPOINT ...... endpoint de Front Door, para purgar su cache
#   - SLACK_WEBHOOK_URL ....... opcional, solo para el paso de notificacion
#
# VARIABLES (no son secretos: viajan DENTRO del JavaScript compilado, asi que
# esconderlas no protegeria nada):
#   - VITE_API_BASE_URL_DEV / _STAGING / _PROD ... URL publica de la API
#   El GITHUB_TOKEN lo inyecta GitHub; se usa para crear el tag del release.
#
# SECRETOS QUE **NO** VAN AQUI (viven en Azure Key Vault y los resuelve el App
# Service con su identidad administrada, CI_CD.md seccion 7):
#   - DATABASE_URL_PROD, JWT_SECRET_KEY, REDIS_URL
# ---------------------------------------------------------------------------

name: Deploy PROD

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version del release, formato vMAJOR.MINOR.PATCH (ej. v0.1.0)"
        required: true
        type: string
      staging_validado:
        description: "Confirmo que esta version esta desplegada en STAGING y sus E2E pasaron"
        required: true
        type: boolean
        default: false

# Nunca dos despliegues a produccion a la vez, y jamas se cancela uno en curso.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AZURE_LOCATION: eastus
  AZURE_RESOURCE_GROUP: matricula
  AZURE_WEBAPP_NAME: matricula-prod
  PROD_URL: https://matricula.example.com

jobs:
  # 1. Validaciones que no cuestan nada y evitan un despliegue mal formado.
  #    Corren ANTES de pedir la aprobacion humana.
  validar:
    name: Validar el release
    runs-on: ubuntu-latest
    # Los inputs del usuario se pasan por variable de entorno y NUNCA se
    # interpolan dentro del script: una interpolacion directa en `run:` es una
    # via de inyeccion de comandos en el runner.
    env:
      VERSION: ${{ inputs.version }}
      STAGING_VALIDADO: ${{ inputs.staging_validado }}
      RAMA: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validar el formato de la version
        run: |
          if ! printf '%s' "$VERSION" | grep --quiet --extended-regexp '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Version invalida::La version no cumple el formato vMAJOR.MINOR.PATCH (ej. v0.1.0)."
            exit 1
          fi
          echo "Version a publicar: $VERSION"

      - name: Comprobar que el tag no exista ya
        run: |
          if git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            echo "::error title=Tag duplicado::El tag ya existe. Un release publicado no se reescribe."
            exit 1
          fi

      - name: Comprobar la confirmacion de staging
        run: |
          if [ "$STAGING_VALIDADO" != "true" ]; then
            echo "::error title=Staging sin validar::A produccion solo llega lo que ya paso por STAGING y sus E2E (CI_CD.md seccion 4.4)."
            exit 1
          fi

      - name: Comprobar que se despliega desde main
        run: |
          if [ "$RAMA" != "main" ]; then
            echo "::error title=Rama incorrecta::Produccion se despliega solo desde main; se recibio '$RAMA'."
            exit 1
          fi

  # 2. Despliegue. El `environment: production` es la puerta de aprobacion manual:
  #    el job queda en espera hasta que un revisor autorizado lo apruebe.
  desplegar:
    name: Desplegar en PRODUCCION
    runs-on: ubuntu-latest
    needs: validar
    environment:
      name: production
      url: https://matricula.example.com
    steps:
      - uses: actions/checkout@v5

      - name: Estado del ambiente
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "::warning title=Despliegue no ejecutado::Los ambientes de Azure aun no estan aprovisionados (Fase 0). Los pasos de ACR, Alembic y App Service estan comentados en .github/workflows/deploy-prod.yml."
          echo "Release: $VERSION | Ambiente: ${AZURE_WEBAPP_NAME} (${AZURE_LOCATION})"

      # ---------------------------------------------------------------------
