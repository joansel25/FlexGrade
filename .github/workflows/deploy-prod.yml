  # 3. Registro del release: el tag se crea solo si el despliegue salio bien
  #    (CI_CD.md seccion 4.4 paso 6).
  publicar-release:
    name: Registrar el tag del release
    runs-on: ubuntu-latest
    needs: desplegar
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Estado del registro
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "::warning title=Tag no creado::El release $VERSION no se etiqueta mientras el despliegue real siga comentado: un tag anunciaria en produccion algo que no se desplego."

