  # - Aparte, porque son dos artefactos distintos con dos destinos distintos. Una imagen
  #   Docker en ACR y un `dist/` de archivos estaticos no comparten ni construccion ni
  #   despliegue.
  # - Despues, porque `VITE_API_BASE_URL` se fija en tiempo de BUILD. El frontend compilado
