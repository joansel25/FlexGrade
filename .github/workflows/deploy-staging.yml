      #
      # # `/health` confirma que el proceso responde; `/health/ready` confirma que ademas
      # # alcanza a PostgreSQL y a Azure Cache for Redis, que es lo que falla cuando el
      # # ambiente quedo mal configurado (endpoint equivocado, NSG cerrado, la referencia
      # # al Key Vault sin resolver porque falta la identidad administrada).
      # - name: Smoke tests contra STAGING
      #   run: |
      #     curl --fail --silent --show-error --max-time 10 "${STAGING_URL}/health"
      #     curl --fail --silent --show-error --max-time 10 "${STAGING_URL}/health/ready"
      # ---------------------------------------------------------------------

  # 2. Suite E2E completa contra el ambiente ya desplegado. Es lo que distingue a
  #    staging de dev: si esto no esta verde, el release no pasa a produccion.
  e2e:
    name: Suite E2E contra STAGING
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Estado de la suite E2E
        run: |
          echo "::warning title=E2E no ejecutada contra staging::No hay ambiente STAGING desplegado todavia (Fase 0). El paso de abajo esta comentado."

      # ---------------------------------------------------------------------
      # TODO(devops): descomentar junto con el despliegue. Los tests e2e apuntan
      # al ambiente real via BASE_URL; hoy corren en proceso dentro de ci.yml.
