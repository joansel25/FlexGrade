# ---------------------------------------------------------------------------
# Despliegue a STAGING (CI_CD.md seccion 4.3)
#
# Automatico en cada push a `qa`. Identico a deploy-dev.yml pero contra el
# ambiente `matricula-staging` y con la etiqueta `staging-<sha>`. Despues del
# despliegue corre la SUITE E2E COMPLETA contra staging: es la puerta que decide
# si el release es apto para produccion.
#
# ESTADO ACTUAL (Fase 0): los ambientes de Azure todavia NO estan aprovisionados.
# Los pasos que tocan Azure estan comentados con un TODO; la estructura del
# workflow si esta escrita y es YAML valido.
#
# SECRETOS QUE NECESITA (Settings -> Secrets and variables -> Actions):
#   - AZURE_CREDENTIALS ....... JSON de la entidad de servicio de Entra ID con
#                               rol Contributor sobre el grupo de recursos
#   - ACR_LOGIN_SERVER ........ p. ej. `matricula.azurecr.io`
#   - AZURE_STORAGE_ACCOUNT ... cuenta con Static website activado (frontend)
#   - FRONTDOOR_PROFILE ....... perfil de Front Door
#   - FRONTDOOR_ENDPOINT ...... endpoint de Front Door, para purgar su cache
#   - SLACK_WEBHOOK_URL ....... opcional, solo para el paso de notificacion
#
# VARIABLES (no son secretos: viajan DENTRO del JavaScript compilado, asi que
# esconderlas no protegeria nada):
#   - VITE_API_BASE_URL_DEV / _STAGING / _PROD ... URL publica de la API
#
# SECRETOS QUE **NO** VAN AQUI (viven en Azure Key Vault y los resuelve el App
# Service con su identidad administrada, CI_CD.md seccion 7):
#   - DATABASE_URL_STAGING, JWT_SECRET_KEY, REDIS_URL
# ---------------------------------------------------------------------------

name: Deploy STAGING

on:
  push:
    branches:
      # STAGING se alimenta de `qa`, no de `main` (CI_CD.md seccion 3). `main` es la rama
      # productiva: lo que llega ahi ya paso por QA, asi que desplegarlo a staging seria
      # validar despues de haber promocionado.
      - qa

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  AZURE_LOCATION: eastus
  AZURE_RESOURCE_GROUP: matricula
  AZURE_WEBAPP_NAME: matricula-staging
  IMAGE_TAG: staging-${{ github.sha }}
  STAGING_URL: https://staging.matricula.example.com

jobs:
  # 1. CI completo antes de tocar nada.
  ci:
    name: CI previo
    uses: ./.github/workflows/ci.yml
    # `backend-ci` pide `pull-requests: write` para que gitleaks pueda comentar el hallazgo
    # en el PR cuando encuentra un secreto. Un workflow LLAMADO no puede pedir mas permisos de
    # los que le concede quien lo llama, y el `permissions: contents: read` de arriba lo dejaba
    # en `pull-requests: none`: la corrida fallaba al arrancar, sin llegar a crear ningun job.
    #
    # Se concede aqui, en el job que hace la llamada, y NO a nivel de workflow: asi los pasos
    # de despliegue —que son los que tocan Azure— siguen sin poder escribir en pull requests.
    permissions:
      contents: read
      pull-requests: write

  deploy:
    name: Desplegar en STAGING
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v5

      - name: Estado del ambiente
        run: |
          echo "::warning title=Despliegue no ejecutado::Los ambientes de Azure aun no estan aprovisionados (Fase 0). Los pasos de ACR, Alembic y App Service estan comentados en .github/workflows/deploy-staging.yml. El CI si se ejecuto y esta verde."
          echo "Imagen que se construiria: ${IMAGE_TAG}"
          echo "Ambiente destino: ${AZURE_WEBAPP_NAME} (${AZURE_LOCATION})"

      # ---------------------------------------------------------------------
      # TODO(devops): descomentar cuando exista el ambiente `matricula-staging`
      # y esten cargados los secretos de Azure.
      # ---------------------------------------------------------------------
      #
      # - name: Autenticarse en Azure
      #   uses: azure/login@v2
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}
      #
      # - name: Autenticarse en Azure Container Registry
      #   run: az acr login --name "${{ secrets.ACR_LOGIN_SERVER }}"
      #
      # - name: Construir la imagen
      #   run: docker build --tag "${{ secrets.ACR_LOGIN_SERVER }}/matricula-backend:${IMAGE_TAG}" ./backend
      #
      # - name: Publicar la imagen en ACR
      #   run: docker push "${{ secrets.ACR_LOGIN_SERVER }}/matricula-backend:${IMAGE_TAG}"
      #
      # # Migraciones antes del deploy de la aplicacion (CI_CD.md seccion 6).
      # - name: Ejecutar migraciones de Alembic contra STAGING
      #   working-directory: backend
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
      #   run: |
      #     pip install -e "."
      #     alembic upgrade head
      #
      #
      # # App Service no construye la imagen: se le dice CUAL descargar de ACR, asi que no
      # # hay ningun artefacto de despliegue que empaquetar aqui. Las opciones de aplicacion
      # # —incluida WEBSITES_PORT=8000, sin la cual App Service busca a uvicorn en el 80 y
      # # marca el sitio como caido— se cargan una sola vez desde deploy/azure/.
      # # `APP_VERSION` cambia en cada despliegue, asi que se escribe aqui y no en la
      # # plantilla de deploy/azure/. Sin esto `/health` responde siempre el valor por
      # # defecto del codigo, y ante un fallo no habria forma de saber que version esta
      # # arriba.
      # - name: Registrar la version desplegada
      #   run: |
      #     az webapp config appsettings set \
      #       --name "${AZURE_WEBAPP_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" \
      #       --settings "APP_VERSION=${IMAGE_TAG}"
      #
      # - name: Desplegar en Azure App Service
      #   uses: azure/webapps-deploy@v3
      #   with:
      #     app-name: ${{ env.AZURE_WEBAPP_NAME }}
