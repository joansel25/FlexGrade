# ---------------------------------------------------------------------------
# Despliegue a STAGING (CI_CD.md seccion 4.3)
#
# Automatico en cada push a `qa`. Identico a deploy-dev.yml pero contra el
# ambiente `matricula-staging` y con la etiqueta `staging-<sha>`. Despues del
# despliegue corre la SUITE E2E COMPLETA contra staging: es la puerta que decide
# si el release es apto para produccion.
#
# ESTADO ACTUAL (Fase 0): los ambientes de AWS todavia NO estan aprovisionados.
# Los pasos que tocan AWS estan comentados con un TODO; la estructura del
# workflow si esta escrita y es YAML valido.
#
# SECRETOS QUE NECESITA (Settings -> Secrets and variables -> Actions):
#   - AWS_ACCESS_KEY_ID ....... credencial del usuario IAM del pipeline
#   - AWS_SECRET_ACCESS_KEY ... contraparte de la anterior
#   - ECR_REPOSITORY .......... URL del repositorio privado de imagenes
#   - SLACK_WEBHOOK_URL ....... opcional, solo para el paso de notificacion
#
# SECRETOS QUE **NO** VAN AQUI (AWS Secrets Manager, inyectados por Elastic
# Beanstalk como variables de entorno, CI_CD.md seccion 7):
#   - DATABASE_URL_STAGING, JWT_SECRET_KEY, REDIS_URL
# ---------------------------------------------------------------------------

name: Deploy STAGING

on:
  push:
    branches:
      # STAGING se alimenta de `qa`, no de `main` (CI_CD.md seccion 3). `main` es la rama
      # productiva: lo que llega ahi ya paso por QA, asi que desplegarlo a staging seria
      # validar despues de haber promocionado.
      - qa

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EB_APPLICATION: matricula
  EB_ENVIRONMENT: matricula-staging
  IMAGE_TAG: staging-${{ github.sha }}
  STAGING_URL: https://staging.matricula.example.com

jobs:
  # 1. CI completo antes de tocar nada.
  ci:
    name: CI previo
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Desplegar en STAGING
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Estado del ambiente
        run: |
          echo "::warning title=Despliegue no ejecutado::Los ambientes de AWS aun no estan aprovisionados (Fase 0). Los pasos de ECR, Alembic y Elastic Beanstalk estan comentados en .github/workflows/deploy-staging.yml. El CI si se ejecuto y esta verde."
          echo "Imagen que se construiria: ${IMAGE_TAG}"
          echo "Ambiente destino: ${EB_ENVIRONMENT} (${AWS_REGION})"

