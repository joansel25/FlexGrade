# Configuracion de Alembic para el Sistema de Matricula.
#
# IMPORTANTE: `sqlalchemy.url` se deja VACIO a proposito.
# La URL de la base de datos es configuracion por ambiente (12-factor) y contiene
# credenciales, asi que jamas se comitea aqui. `alembic/env.py` la obtiene en
# tiempo de ejecucion desde `app.infrastructure.config.settings.get_settings()`,
# que a su vez la lee de la variable de entorno DATABASE_URL.

[alembic]
script_location = alembic

# Permite que `from app...` funcione al ejecutar alembic desde backend/.
prepend_sys_path = .

# Nombre de los archivos de migracion: <fecha>_<revision>_<descripcion>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Las fechas de los archivos de version se generan en UTC.
timezone = UTC

version_path_separator = os

sqlalchemy.url =


[post_write_hooks]
# Las migraciones generadas se formatean con black e isort para que no rompan
# `make lint` (line length 100, definida en pyproject.toml).
hooks = black,isort

black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

isort.type = console_scripts
isort.entrypoint = isort
isort.options = REVISION_SCRIPT_FILENAME


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
